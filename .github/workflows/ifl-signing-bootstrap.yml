name: ifl-signing-bootstrap
# Run once, by hand, on a release tag (`gh workflow run ifl-signing-bootstrap.yml
# --ref ifl-mobile-v<version>`): the job refuses any other ref, and the
# `release` environment accepts only ifl-mobile-v* tags and waits for Josh.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  match:
    if: startsWith(github.ref, 'refs/tags/ifl-mobile-v')
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1.313.0
      - name: Fastlane
        working-directory: fastlane
        run: bundle config set --local path vendor/bundle && bundle install
      - name: Deploy key (write access) for the match repository
        env:
          MATCH_GIT_DEPLOY_KEY: ${{ secrets.MATCH_GIT_DEPLOY_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_GIT_DEPLOY_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Temporary keychain for the new certificate
        # match installs the certificate it creates; a throwaway keychain
        # keeps it out of the runner's login keychain and avoids prompts.
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" ifl_bootstrap.keychain
          security set-keychain-settings -lut 1800 ifl_bootstrap.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" ifl_bootstrap.keychain
      - name: Certificates and profiles
        working-directory: fastlane
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          umask 077
          jq -n --arg id "$ASC_API_KEY_ID" --arg issuer "$ASC_API_ISSUER_ID" --arg key "$ASC_API_KEY_P8" \
            '{key_id: $id, issuer_id: $issuer, key: $key, in_house: false}' > "$RUNNER_TEMP/asc.json"
          bundle exec fastlane match appstore --readonly false --api_key_path "$RUNNER_TEMP/asc.json" \
            --app_identifier "com.iflgm.chat,com.iflgm.chat.MattermostShare,com.iflgm.chat.NotificationService" \
            --git_url git@github.com:friscojosh/ifl-chat-signing.git --team_id "$FASTLANE_TEAM_ID" \
            --keychain_name ifl_bootstrap.keychain --keychain_password "$KEYCHAIN_PASSWORD"
      - name: Remove signing material
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519 "${RUNNER_TEMP:?}/asc.json"
          security delete-keychain ifl_bootstrap.keychain 2>/dev/null || true
