name: ifl-upstream
# Weekly trial merge of the newest stable mattermost/mattermost-mobile tag.
# The merged tree is untrusted: it is built only in `trial`, which has a
# read-only token, no secrets and no persisted credentials, and which emits
# only validated values (a semver tag, a version, fixed status words).
# `report` opens or updates the issue without checking out or running it.
on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      merge: ${{ steps.merge.outputs.merge }}
      checks: ${{ steps.checks.outputs.checks }}
      needs: ${{ steps.merge.outputs.needs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Newest stable upstream tag not yet merged
        id: tag
        run: |
          # Upstream tags only (own namespace, so no tag in this fork can stand in).
          git fetch --quiet --no-tags https://github.com/mattermost/mattermost-mobile.git '+refs/tags/v*:refs/ifl-upstream-tags/v*'
          TAG=$(git for-each-ref --format='%(refname:lstrip=2)' refs/ifl-upstream-tags/ | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$TAG" ] || git merge-base --is-ancestor "refs/ifl-upstream-tags/$TAG" HEAD; then
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Trial merge
        if: steps.tag.outputs.tag != ''
        id: merge
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name ifl-upstream
          git config user.email ifl-upstream@users.noreply.github.com
          NEEDS=$(git show "refs/ifl-upstream-tags/$TAG:app/constants/supported_server.ts" | sed -n "s/.*FULL_VERSION = '\([0-9.]*\)'.*/\1/p" | head -1)
          if printf '%s' "$NEEDS" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then echo "needs=$NEEDS" >> "$GITHUB_OUTPUT"; else echo "needs=unknown" >> "$GITHUB_OUTPUT"; fi
          if git merge --no-edit "refs/ifl-upstream-tags/$TAG"; then
            echo "merge=clean" >> "$GITHUB_OUTPUT"
          else
            echo "Conflicted files:"
            git diff --name-only --diff-filter=U
            git merge --abort
            echo "merge=conflicts" >> "$GITHUB_OUTPUT"
          fi
      - name: IFL assets
        if: steps.merge.outputs.merge == 'clean'
        run: rm -rf assets/override && cp -R ifl/assets assets/override && rm -rf assets/override/src
      - uses: ./.github/actions/prepare-node-deps
        if: steps.merge.outputs.merge == 'clean'
      - name: Checks on the merge
        if: steps.merge.outputs.merge == 'clean'
        id: checks
        run: |
          if npm run tsc && npx jest app/utils/ifl app/components/ifl --maxWorkers=2; then
            echo "checks=pass" >> "$GITHUB_OUTPUT"
          else
            echo "checks=fail" >> "$GITHUB_OUTPUT"
          fi

  report:
    needs: trial
    if: always() && needs.trial.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.trial.outputs.tag }}
          MERGE: ${{ needs.trial.outputs.merge }}
          CHECKS: ${{ needs.trial.outputs.checks }}
          NEEDS: ${{ needs.trial.outputs.needs }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Accept only the values `trial` can emit.
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::bad tag"; exit 1; }
          printf '%s' "$NEEDS" | grep -Eq '^([0-9]+(\.[0-9]+){1,3}|unknown)$' || NEEDS=unknown
          case "$MERGE" in
            clean) MERGE_TEXT="merges cleanly" ;;
            conflicts) MERGE_TEXT="has merge conflicts (listed in the run log)" ;;
            *) MERGE_TEXT="trial merge did not finish (see the run log)" ;;
          esac
          case "$CHECKS" in
            pass) CHECKS_TEXT="types and IFL tests pass" ;;
            fail) CHECKS_TEXT="checks FAIL (see the run log)" ;;
            *) CHECKS_TEXT="checks not run" ;;
          esac
          TITLE="Upstream $TAG"
          BODY="Mattermost mobile $TAG: $MERGE_TEXT; $CHECKS_TEXT. It needs a server of at least $NEEDS (IFL Chat's server fork is Mattermost 12.1.0; merge the server first if that is lower). Run: $RUN. Merge on a workstation (IFL.md, Upstream releases)."
          N=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then gh issue comment "$N" -R "$GITHUB_REPOSITORY" --body "$BODY"; else gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"; fi
